<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Threads — редизайн</title>
<script>
  /* ?view=desktop|mobile&theme=light|dark&screen=posts|keywords|analytics|states — до первой отрисовки */
  (function () {
    var q = new URLSearchParams(location.search);
    document.documentElement.setAttribute('data-theme', q.get('theme') === 'light' ? 'light' : 'dark');
    document.documentElement.setAttribute('data-view', q.get('view') === 'mobile' ? 'mobile' : 'desktop');
    var s = q.get('screen');
    document.documentElement.setAttribute('data-screen', ['keywords', 'analytics', 'states'].indexOf(s) >= 0 ? s : 'posts');
  })();
</script>
<style>
/* ============ ТОКЕНЫ ПЛАТФОРМЫ (копия значений из ui.css / set.html DEFAULTS, как в утверждённом макете threads-mockup) ============ */
:root {
  color-scheme: dark;
  --ui-brand: #00a0ff;
  --ui-danger: #f87171;
  --ui-ok: #4ade80;
  --ui-warn: #fbbf24;
  --ui-violet: #a78bfa;
  --ui-id: #fbbf24;
  --ui-bg: #0a0a0a;
  --ui-page-bg: #0e0e0e;
  --ui-surface: #141414;
  --ui-card-bg: #141414;
  --ui-surface-2: #1a1a1a;
  --ui-surface-3: #111111;
  --ui-line: #262626;
  --ui-card-border: #262626;
  --ui-line-2: #1e1e1e;
  --ui-tx: #e8e8e8;
  --ui-tx-2: #8b8b8b;
  --ui-tx-3: #6a6a6a;
  --ui-row-hover: #161616;
  --ui-badge-bg: #e05252;
  --ui-badge-text: #ffffff;
  --ui-btn1-text: #ffffff;
  --ui-radius: 8px;
  --ui-card-radius: 12px;
  --ui-radius-lg: 24px;
  --ui-chip-radius: 16px;
  --ui-sheet-radius: 22px;
  --ui-tap: 44px;
  --ui-badge-h: 18px;
  --ui-badge-radius: 9px;
  --ui-shadow-c: #000;
  --ui-shadow-sm: 0 2px 6px -1px rgba(0,0,0,.25);
  --ui-shadow-md: 0 6px 18px -2px rgba(0,0,0,.30);
  --ui-shadow-lg: 0 16px 40px -8px rgba(0,0,0,.35);
  /* softVars(): 9% / 22% к фону карточки; текст в тёмной — чистый цвет */
  --ui-brand-soft: color-mix(in srgb, var(--ui-brand) 9%, var(--ui-card-bg));
  --ui-brand-soft-line: color-mix(in srgb, var(--ui-brand) 22%, var(--ui-card-bg));
  --ui-brand-soft-tx: var(--ui-brand);
  --ui-ok-soft: color-mix(in srgb, var(--ui-ok) 9%, var(--ui-card-bg));
  --ui-ok-soft-line: color-mix(in srgb, var(--ui-ok) 22%, var(--ui-card-bg));
  --ui-ok-soft-tx: var(--ui-ok);
  --ui-warn-soft: color-mix(in srgb, var(--ui-warn) 9%, var(--ui-card-bg));
  --ui-warn-soft-line: color-mix(in srgb, var(--ui-warn) 22%, var(--ui-card-bg));
  --ui-warn-soft-tx: var(--ui-warn);
  --ui-violet-soft: color-mix(in srgb, var(--ui-violet) 12%, var(--ui-card-bg));
  --ui-violet-soft-line: color-mix(in srgb, var(--ui-violet) 32%, var(--ui-card-bg));
  --ui-violet-soft-tx: color-mix(in srgb, var(--ui-violet) 60%, var(--ui-tx));

  /* ---- СВОЁ (нет в токенах платформы, см. README) ---- */
  --th-radius: 18px;          /* литерал .sv2-nav (seo-v2.css) — карточки каркаса /analytics */
  --th-row-radius: 14px;      /* литерал .sv2-tile (seo-v2.css) */
  --th-glass: color-mix(in srgb, var(--ui-card-bg) 86%, transparent);  /* «стекло» нижней панели iOS */
  --th-av-l: 42%;             /* светлота аватара-инициалов, как .sv2-fav hsl(h 55% 42%) */
}
:root[data-theme="light"] {
  color-scheme: light;
  --ui-brand: #0072c6;
  --ui-ok: #15803d;
  --ui-warn: #b45309;
  --ui-id: #a16207;
  --ui-bg: #f6f8fb;
  --ui-page-bg: #f6f8fb;
  --ui-surface: #ffffff;
  --ui-card-bg: #ffffff;
  --ui-surface-2: #eef2f7;
  --ui-surface-3: #f3f6fa;
  --ui-line: #dde5ee;
  --ui-card-border: #dde5ee;
  --ui-line-2: #e6ecf3;
  --ui-tx: #0f1c2e;
  --ui-tx-2: #5a6b80;
  --ui-tx-3: #8595a8;
  --ui-row-hover: #f3f6fa;
  --ui-shadow-c: rgba(15,28,46,.35);
  --ui-shadow-sm: 0 2px 6px -1px color-mix(in srgb, var(--ui-shadow-c) 23%, transparent);
  --ui-shadow-md: 0 6px 18px -2px color-mix(in srgb, var(--ui-shadow-c) 29%, transparent);
  --ui-shadow-lg: 0 16px 40px -8px color-mix(in srgb, var(--ui-shadow-c) 40%, transparent);
  --ui-brand-soft-tx: color-mix(in srgb, var(--ui-brand) 90%, var(--ui-tx));
  --ui-ok-soft-tx: color-mix(in srgb, var(--ui-ok) 90%, var(--ui-tx));
  --ui-warn-soft-tx: color-mix(in srgb, var(--ui-warn) 90%, var(--ui-tx));
  --th-glass: color-mix(in srgb, var(--ui-card-bg) 84%, transparent);
  --th-av-l: 46%;
}


/* ============ БАЗА ============ */
html, body { margin: 0; }
* { box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Liberation Sans", sans-serif;
  background: var(--ui-page-bg); color: var(--ui-tx); font-size: 14px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; overflow: hidden;
}
svg.i { width: 18px; height: 18px; flex: 0 0 auto; fill: none; stroke: currentColor; }
.i-s { width: 16px !important; height: 16px !important; }
.i-xs { width: 14px !important; height: 14px !important; }
.ellip { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }

/* ---- общие ---- */
.av { --s: 40px; position: relative; flex: 0 0 auto; width: var(--s); height: var(--s); border-radius: 50%;
  display: inline-grid; place-items: center; color: #fff; font-weight: 600; font-size: calc(var(--s) * .36);
  background: hsl(var(--h, 210) 55% var(--th-av-l)); }
.av.is-brand { background: var(--ui-brand); }
.card { background: var(--ui-card-bg); border: 1px solid var(--ui-card-border); border-radius: var(--th-radius); min-width: 0; }
[data-theme="light"] .card { box-shadow: var(--ui-shadow-sm); }
.card-h { display: flex; align-items: center; gap: 10px; padding: 16px 18px 6px; }
.card-h h2 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
.card-h .sub { font-size: 12.5px; color: var(--ui-tx-3); }
.card-h .r { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.cap { padding: 14px 4px 8px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ui-tx-3); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: var(--ui-tap); padding: 0 18px; border: 1px solid var(--ui-brand);
  border-radius: var(--ui-radius); background: var(--ui-brand); color: var(--ui-btn1-text); font: inherit; font-size: 14px; font-weight: 600; white-space: nowrap; }
.btn[disabled], .btn.is-dis { background: var(--ui-surface-2); border-color: var(--ui-line); color: var(--ui-tx-3); }
.tbtn { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 12px; border: 1px solid var(--ui-line);
  border-radius: 999px; background: var(--ui-surface-2); color: var(--ui-tx); font: inherit; font-size: 13px; font-weight: 500; white-space: nowrap; }
.tbtn.is-on { background: var(--ui-brand-soft); border-color: var(--ui-brand-soft-line); color: var(--ui-brand-soft-tx); }
.tbtn.is-ghost { background: transparent; }
.lnk { display: inline-flex; align-items: center; gap: 5px; color: var(--ui-tx-2); font-size: 12.5px; font-weight: 500; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; background: var(--ui-ok); box-shadow: 0 0 0 3px var(--ui-ok-soft); }
.dot.err { background: var(--ui-danger); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ui-danger) 14%, var(--ui-card-bg)); }

/* сегмент вкладок (iOS) — #posts / #keywords / #аналитика */
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 12px; background: var(--ui-surface-2); }
.seg span { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 14px; border-radius: 9px; color: var(--ui-tx-2); font-size: 13.5px; font-weight: 500; white-space: nowrap; }
.seg span svg { width: 15px; height: 15px; }
.seg span.is-on { background: var(--ui-card-bg); color: var(--ui-tx); box-shadow: var(--ui-shadow-sm); font-weight: 600; }
[data-theme="dark"] .seg span.is-on { background: var(--ui-line); }

/* статус подключения — капсула */
.conn { display: inline-flex; align-items: center; gap: 10px; height: 40px; padding: 0 6px 0 14px; border-radius: 999px; background: var(--ui-card-bg);
  border: 1px solid var(--ui-card-border); font-size: 13px; color: var(--ui-tx-2); white-space: nowrap; }
[data-theme="light"] .conn { box-shadow: var(--ui-shadow-sm); }
.conn b { color: var(--ui-tx); font-weight: 600; }
.conn .sep { width: 3px; height: 3px; border-radius: 50%; background: var(--ui-tx-3); }
.conn .btn { height: 30px; padding: 0 12px; font-size: 12.5px; border-radius: 999px; }
.conn:not(.has-btn) { padding-right: 16px; }

/* плашка «нет прав на статистику» */
.warn { display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 16px; border-radius: var(--th-row-radius);
  background: color-mix(in srgb, var(--ui-danger) 8%, var(--ui-card-bg)); border: 1px solid color-mix(in srgb, var(--ui-danger) 24%, var(--ui-card-bg)); }
.warn .ico { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; flex: 0 0 auto;
  background: color-mix(in srgb, var(--ui-danger) 16%, var(--ui-card-bg)); color: var(--ui-danger); }
.warn .t { flex: 1 1 auto; font-size: 13.5px; color: var(--ui-tx); min-width: 0; }
.warn .t small { display: block; color: var(--ui-tx-2); font-size: 12.5px; }
.warn .btn { height: 36px; font-size: 13px; padding: 0 14px; border-radius: 999px; }

/* ============ ПОСТ (стиль Threads) ============ */
.post { display: flex; gap: 12px; padding: 14px 18px 12px; position: relative; }
.post + .post::before { content: ""; position: absolute; left: 70px; right: 18px; top: 0; height: 1px; background: var(--ui-line-2); }
.post-l { display: flex; flex-direction: column; align-items: center; flex: 0 0 40px; }
.post-line { flex: 1 1 auto; width: 2px; min-height: 12px; margin: 6px 0 0; border-radius: 2px; background: var(--ui-line); }
.post-b { flex: 1 1 auto; min-width: 0; }
.post-h { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 13px; color: var(--ui-tx-3); }
.post-h b { font-size: 14.5px; font-weight: 600; color: var(--ui-tx); }
.post-h .lnk { margin-left: auto; }
.post-h .tag { display: inline-flex; align-items: center; gap: 4px; padding: 0 7px; height: 20px; border-radius: 6px; background: var(--ui-surface-2); color: var(--ui-tx-2); font-size: 11.5px; font-weight: 500; }
.post-t { margin-top: 3px; font-size: 14.5px; line-height: 1.5; color: var(--ui-tx); white-space: pre-line; }
.post-t.is-empty { color: var(--ui-tx-3); font-style: italic; }
.stats { display: flex; align-items: center; gap: 4px; margin-top: 10px; flex-wrap: wrap; }
.stat { display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 10px 0 8px; border-radius: 999px; color: var(--ui-tx-2); font-size: 13px; font-variant-numeric: tabular-nums; }
.stat svg { width: 17px; height: 17px; }
.stat.is-box { background: var(--ui-surface-3); border: 1px solid var(--ui-line-2); }
.stat.is-na { color: var(--ui-tx-3); font-size: 12.5px; padding-left: 0; }
.stats .tbtn { margin-left: auto; height: 32px; }
.stats .tbtn .n { font-weight: 600; }
/* раскрытые ответы — ветка */
.reps { margin-top: 10px; }
.rep { display: flex; gap: 10px; padding: 8px 0 4px; }
.rep .av { --s: 28px; font-size: 10.5px; }
.rep-b { min-width: 0; font-size: 13.5px; line-height: 1.45; color: var(--ui-tx); }
.rep-b b { font-weight: 600; margin-right: 4px; }
.rep-b small { color: var(--ui-tx-3); font-size: 12px; }

/* ============ КОМПОЗЕР ============ */
.comp { padding: 16px 18px 14px; display: flex; flex-direction: column; gap: 12px; }
.comp-who { display: flex; align-items: center; gap: 10px; }
.comp-who b { font-size: 14.5px; }
.comp-who small { display: block; font-size: 12px; color: var(--ui-tx-3); }
.ta { min-height: 132px; padding: 12px 14px; border-radius: 14px; background: var(--ui-surface-3); border: 1px solid var(--ui-line);
  font-size: 14.5px; line-height: 1.5; color: var(--ui-tx); white-space: pre-line; }
.ta.is-ph { color: var(--ui-tx-3); }
.ta.is-focus { border-color: var(--ui-brand); box-shadow: 0 0 0 3px var(--ui-brand-soft); background: var(--ui-card-bg); }
.prev { position: relative; align-self: flex-start; width: 100%; height: 156px; border-radius: 14px; overflow: hidden; border: 1px solid var(--ui-line-2);
  background:
    radial-gradient(circle at 78% 30%, hsl(40 90% 70%) 0 12%, transparent 13%),
    linear-gradient(180deg, hsl(205 70% 62%) 0%, hsl(205 60% 78%) 55%, hsl(150 32% 46%) 56%, hsl(150 38% 34%) 100%); }
.prev::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 46%;
  background: linear-gradient(150deg, transparent 0 40%, hsl(150 30% 28%) 41% 100%); opacity: .7; }
.prev .rm { position: absolute; top: 8px; right: 8px; z-index: 1; display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 11px 0 9px;
  border-radius: 999px; background: rgba(15,20,28,.62); color: #fff; font-size: 12.5px; font-weight: 500; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.prev .rm svg { width: 14px; height: 14px; }
.comp-f { display: flex; align-items: center; gap: 10px; }
.cnt { white-space: nowrap; flex: 0 0 auto; display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ui-tx-3); font-variant-numeric: tabular-nums; }
.cnt .ring { flex: 0 0 auto; width: 20px; height: 20px; border-radius: 50%; background: conic-gradient(var(--ui-brand) calc(var(--p) * 1%), var(--ui-line) 0); position: relative; }
.cnt .ring::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--ui-card-bg); }
.cnt.is-over { color: var(--ui-danger); } .cnt.is-over .ring { background: var(--ui-danger); }
.comp-f .btn { margin-left: auto; border-radius: 999px; }

/* аккаунт — iOS-строки */
.irows { padding: 4px 0 6px; }
.irow { display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 0 18px; position: relative; font-size: 14px; }
.irow + .irow::before { content: ""; position: absolute; left: 18px; right: 0; top: 0; height: 1px; background: var(--ui-line-2); }
.irow .k { color: var(--ui-tx-2); }
.irow .v { margin-left: auto; color: var(--ui-tx); font-weight: 500; display: inline-flex; align-items: center; gap: 8px; }
.irow .v.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12.5px; color: var(--ui-tx-2); }

/* поиск по ключам */
.sbar { display: flex; gap: 10px; align-items: center; }
.sfield { flex: 1 1 auto; display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 16px; border-radius: 999px; background: var(--ui-surface-2);
  color: var(--ui-tx-3); font-size: 15px; border: 1px solid transparent; }
.sfield.is-val { color: var(--ui-tx); border-color: var(--ui-brand); box-shadow: 0 0 0 3px var(--ui-brand-soft); background: var(--ui-card-bg); }
.sbar .btn { border-radius: 999px; height: 46px; }

/* аналитика */
.an-grid { display: grid; gap: 16px; }
.an { padding: 18px 20px 16px; display: flex; height: 100%; flex-direction: column; gap: 6px; min-width: 0; }
.an-t { display: flex; align-items: center; gap: 10px; font-size: 13.5px; color: var(--ui-tx-2); font-weight: 500; }
.an-t .ic { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; background: var(--ui-brand-soft); color: var(--ui-brand-soft-tx); }
.an-t .ic svg { width: 16px; height: 16px; }
.an-t .ic.vio { background: var(--ui-violet-soft); color: var(--ui-violet-soft-tx); }
.an-t .ic.ok { background: var(--ui-ok-soft); color: var(--ui-ok-soft-tx); }
.an-t .ic.amb { background: var(--ui-warn-soft); color: var(--ui-warn-soft-tx); }
.an-n { font-size: 40px; font-weight: 700; line-height: 1.05; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.an-p { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--ui-tx-2); }
.delta { display: inline-flex; align-items: center; gap: 3px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
.delta.up { background: var(--ui-ok-soft); color: var(--ui-ok-soft-tx); }
.delta.down { background: color-mix(in srgb, var(--ui-danger) 10%, var(--ui-card-bg)); color: var(--ui-danger); }
.an-note { font-size: 12.5px; color: var(--ui-tx-3); }
.bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; margin-top: auto; padding-top: 10px; }
.bar { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.bar i { display: block; width: 100%; border-radius: 6px; background: color-mix(in srgb, var(--ui-tx) 14%, var(--ui-card-bg)); }
.bar.is-last i { background: var(--ui-brand); }
.bar span { font-size: 11px; color: var(--ui-tx-3); }
.bar.is-last span { color: var(--ui-tx); font-weight: 600; }
.an-upd { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ui-tx-3); padding: 14px 4px 0; }

/* пустые состояния */
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 28px 20px; color: var(--ui-tx-2); font-size: 13.5px; }
.empty .ico { width: 48px; height: 48px; border-radius: 16px; display: grid; place-items: center; background: var(--ui-surface-2); color: var(--ui-tx-3); }
.empty .ico svg { width: 22px; height: 22px; }
.empty b { color: var(--ui-tx); font-size: 15px; }
.empty .btn { height: 38px; border-radius: 999px; font-size: 13px; margin-top: 4px; }
.toast { display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 16px 0 12px; border-radius: 999px; background: var(--ui-tx); color: var(--ui-card-bg); font-size: 13.5px; font-weight: 500; box-shadow: var(--ui-shadow-md); }
.toast svg { color: var(--ui-ok); }
[data-theme="light"] .toast svg { color: #4ade80; }
.toast.err svg { color: var(--ui-danger); }
.st-lbl { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ui-tx-3); margin: 0 0 8px 2px; }
.skel { height: 12px; border-radius: 6px; background: var(--ui-surface-2); }

/* ============ ПК ============ */
[data-view="desktop"] body { width: 1440px; height: 900px; }
.rail { position: fixed; left: 24px; top: 24px; bottom: 24px; width: 84px; padding: 20px; border-radius: 24px;
  background: var(--ui-surface); box-shadow: var(--ui-shadow-lg); display: flex; flex-direction: column; gap: 16px; z-index: 5; }
[data-theme="light"] .rail { box-shadow: var(--ui-shadow-lg), 0 0 0 1px var(--ui-line-2); }
.rail .r-ava { width: 44px; height: 44px; border-radius: 50%; background: var(--ui-brand); color: #fff; display: grid; place-items: center; font-weight: 600; font-size: 15px; position: relative; }
.rail .r-ava i { position: absolute; right: 0; bottom: 0; width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--ui-surface); background: var(--ui-ok); }
.rail .r-search { width: 44px; height: 44px; border: 1px solid var(--ui-line-2); border-radius: 10px; display: grid; place-items: center; color: var(--ui-tx-2); }
.rail .r-mid { flex: 1 1 auto; display: flex; flex-direction: column; }
.rail .r-it { position: relative; height: 52px; width: 44px; display: grid; place-items: center; color: var(--ui-tx-2); }
.rail .r-it svg { width: 22px; height: 22px; position: relative; }
.rail .r-it.is-on { color: var(--ui-brand); }
.rail .r-it.is-on::before { content: ""; position: absolute; inset: 4px 0; border-radius: 12px; background: color-mix(in srgb, var(--ui-brand) 12%, transparent); }
.rail .r-it .ui-badge { position: absolute; top: 6px; right: -10px; display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--ui-badge-bg); color: var(--ui-badge-text); font-size: 10px; font-weight: 600; }
.rail .r-act { display: flex; flex-direction: column; gap: 8px; }

    { u: 'kirill.dev', h: 40, t: '21.10.2026, 21:02', x: 'Ускорил сайт до 95 в PageSpeed — позиции выросли через две недели. SEO-продвижение начинается с техники.' },
    { u: 'smm.lab', h: 260, t: '20.10.2026, 16:18', x: 'Threads как канал: за месяц 40 заявок на SEO-продвижение. Делимся форматом постов.' }
  ];
  var DAYS = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
  var AN = [   // /api/threads/analytics → cards.{posts,views,replies,followers}
    { key: 'posts', title: 'Ваши действия', ic: 'edit', c: '', cur: '9', prev: '6', up: true, note: 'публикации', s: [1, 2, 0, 1, 3, 1, 1] },
    { key: 'views', title: 'Просмотры', ic: 'eye', c: 'vio', cur: '12 480', prev: '9 935', up: true, s: [1300, 1650, 980, 2100, 2400, 1700, 2350] },
    { key: 'replies', title: 'Ответы', ic: 'reply', c: 'ok', cur: '64', prev: '71', up: false, s: [8, 12, 6, 9, 11, 7, 11] },
    { key: 'followers', title: 'Новые подписчики', ic: 'users', c: 'amb', cur: '38', prev: '24', up: true, note: 'Сейчас подписчиков: 1 912', s: [3, 5, 4, 8, 6, 5, 7] }
  ];

  /* ---------- блоки ---------- */
  function seg() {
    var t = [['posts', 'Мои посты', 'newspaper'], ['keywords', 'Ключи', 'search'], ['analytics', 'Аналитика', 'chart']];
    var cur = SCR === 'states' ? 'posts' : SCR;
    return '<div class="seg">' + t.map(function (x) { return '<span class="' + (x[0] === cur ? 'is-on' : '') + '">' + (M ? '' : ic(x[2])) + x[1] + '</span>'; }).join('') + '</div>';
  }
  function conn(off) {
    if (off) return '<span class="conn has-btn"><span class="dot err"></span><b>Не подключено</b><span class="btn">' + ic('link', 'i-xs') + 'Подключить</span></span>';
    return '<span class="conn"><span class="dot"></span><b>Подключено</b><span class="sep"></span>@' + ME.username + '<span class="sep"></span>токен до ' + ME.exp + '</span>';
  }
  function warn() {
    return '<div class="warn"><span class="ico">' + ic('circle-alert', 'i-s') + '</span><span class="t">Нет прав на статистику Threads<small>Переподключите Threads с правом insights</small></span><span class="btn">' + ic('refresh', 'i-xs') + 'Переподключить</span></div>';
  }
  function avU(u, h, s) { var a = u.replace(/[^a-z]/g, '').slice(0, 2).toUpperCase(); return '<span class="av" style="--h:' + h + (s ? ';--s:' + s + 'px' : '') + '">' + a + '</span>'; }
  function post(p) {
    var me = '<span class="av is-brand">DC</span>';
    var hasLine = p.open;
    var head = '<div class="post-h"><b>' + ME.username + '</b>' + (p.repost ? '<span class="tag">' + ic('repeat-2', 'i-xs') + 'репост</span>' : '') + '<span>' + p.t + '</span>'
      + '<span class="lnk">' + (M ? '' : 'Открыть') + ic('external-link', 'i-xs') + '</span></div>';
    var body;
    if (p.repost) {
      body = '<div class="post-t is-empty">(без текста)</div><div class="stats"><span class="stat is-na">' + ic('info', 'i-xs') + '&nbsp;Репост — статистики нет</span>'
        + '<span class="tbtn is-ghost">' + ic('message', 'i-xs') + 'Ответы</span></div>';
    } else {
      var s = p.s;
      body = '<div class="post-t">' + p.text + '</div><div class="stats">'
        + '<span class="stat" title="просмотры">' + ic('eye') + s.views + '</span>'
        + '<span class="stat" title="лайки">' + ic('heart') + s.likes + '</span>'
        + '<span class="stat" title="ответы">' + ic('message') + s.replies + '</span>'
        + '<span class="stat" title="репосты">' + ic('repeat-2') + s.reposts + '</span>'
        + '<span class="stat" title="цитаты">' + ic('text-quote') + s.quotes + '</span>'
        + (M ? '' : '<span class="tbtn ' + (p.open ? 'is-on' : 'is-ghost') + '">' + ic('message', 'i-xs') + 'Ответы' + '</span>')
        + '</div>';
      if (M) body += '<div class="stats" style="margin-top:6px"><span class="tbtn ' + (p.open ? 'is-on' : 'is-ghost') + '" style="margin-left:0">' + ic('message', 'i-xs') + (p.open ? 'Скрыть ответы' : 'Ответы') + '</span></div>';
      if (p.open) body += '<div class="reps">' + p.reps.slice(0, M ? 2 : 3).map(function (r) {
        return '<div class="rep">' + avU(r.u, r.h) + '<div class="rep-b"><b>@' + r.u + '</b><small>' + r.w + '</small><br>' + r.t + '</div></div>';
      }).join('') + '</div>';
    }
    return '<div class="post"><div class="post-l">' + me + (hasLine ? '<span class="post-line"></span>' : '') + '</div><div class="post-b">' + head + body + '</div></div>';
  }
  function composer(opts) {
    opts = opts || {};
    var txt = opts.empty ? '<div class="ta is-ph">О чём напишем в Threads?</div>'
      : '<div class="ta is-focus">Пять причин, почему падает CTR после смены сниппета — разбор в карточках 👇\nСохраните, чтобы не потерять.</div>';
    var n = opts.empty ? 0 : 86;
    return '<div class="comp">'
      + (M ? '' : '<div class="comp-who"><span class="av is-brand" style="--s:36px">DC</span><div><b>Новый пост</b><small>@' + ME.username + ' · Threads</small></div></div>')
      + txt
      + (opts.img ? '<div class="prev"><span class="rm">' + ic('close') + 'Убрать картинку</span></div>' : '')
      + '<div class="comp-f"><span class="tbtn">' + ic('image', 'i-s') + (M ? '' : 'Картинка') + '</span>'
      + '<span class="cnt"><span class="ring" style="--p:' + Math.round(n / 5) + '"></span>' + n + ' / 500</span>'
      + '<span class="btn' + (opts.off ? ' is-dis' : '') + '">' + ic('send', 'i-s') + 'Опубликовать</span></div></div>';
  }
  function account() {
    return '<div class="card"><div class="card-h"><h2>Аккаунт</h2></div><div class="irows">'
      + '<div class="irow"><span class="k">Статус</span><span class="v"><span class="dot"></span>Подключено</span></div>'
      + '<div class="irow"><span class="k">ID аккаунта</span><span class="v mono">' + ME.id + '</span></div>'
      + '<div class="irow"><span class="k">Токен действует до</span><span class="v">' + ME.exp + '</span></div>'
      + '</div></div>';
  }
  function kwRow(k) {
    return '<div class="post"><div class="post-l">' + avU(k.u, k.h) + '</div><div class="post-b"><div class="post-h"><b>@' + k.u + '</b><span>' + k.t + '</span><span class="lnk">' + (M ? '' : 'Открыть') + ic('external-link', 'i-xs') + '</span></div><div class="post-t">' + k.x + '</div></div></div>';
  }
  function bars(s) {
    var mx = Math.max.apply(null, s);
    return '<div class="bars">' + s.map(function (v, i) {
      var h = mx ? Math.max(4, Math.round(v / mx * (M ? 62 : 92))) : 4;
      return '<div class="bar' + (i === 6 ? ' is-last' : '') + '"><i style="height:' + h + 'px"></i><span>' + DAYS[i] + '</span></div>';
    }).join('') + '</div>';
  }
  function anCard(a) {
    var d = '<span class="delta ' + (a.up ? 'up' : 'down') + '">' + (a.up ? '↑' : '↓') + '</span>';
    var head = '<div class="an-t"><span class="ic ' + a.c + '">' + ic(a.ic) + '</span>' + a.title + '</div>';
    var info = '<div class="an-n">' + a.cur + '</div><div class="an-p">Предыдущие: ' + a.prev + ' ' + d + '</div>' + (a.note ? '<div class="an-note">' + a.note + '</div>' : '');
    if (M) return '<div class="m-card an">' + head + '<div class="an-row"><div>' + info + '</div>' + bars(a.s) + '</div></div>';
    return '<div class="card an">' + head + info + bars(a.s) + '</div>';
  }
  var UPD = '<div class="an-upd">' + ic('clock', 'i-xs') + 'За последние 7 дней, в сравнении с предыдущими 7. Обновлено: сегодня, 09:00</div>';

  function emptyBox(icon, title, text, btn) {
    return '<div class="empty"><span class="ico">' + ic(icon) + '</span><b>' + title + '</b>' + (text ? '<span>' + text + '</span>' : '') + (btn || '') + '</div>';
  }
  function statesSheet() {
    var cell = function (lbl, html) { return '<div><div class="st-lbl">' + lbl + '</div>' + html + '</div>'; };
    var items = [
      cell('Статус: не подключено', '<div class="card" style="padding:14px">' + conn(true) + '</div>'),
      cell('Нет прав на статистику', warn()),
      cell('Композер без подключения', '<div class="card">' + composer({ empty: true, off: true }) + '</div>'),
      cell('Мои посты — не подключено', '<div class="card">' + emptyBox('link', 'Подключи Threads, чтобы увидеть посты', '', '') + '</div>'),
      cell('Мои посты — пусто', '<div class="card">' + emptyBox('newspaper', 'Постов пока нет', '') + '</div>'),
      cell('Ответы — пусто / загрузка', '<div class="card" style="padding:4px 0">' + post({ t: 'сегодня, 10:02', text: 'Короткий пост без ответов.', s: { views: '96', likes: 2, replies: 0, reposts: 0, quotes: 0 } })
        .replace('tbtn is-ghost', 'tbtn is-on') + '<div style="padding:0 18px 14px 70px;font-size:13px;color:var(--ui-tx-3)">Ответов пока нет</div></div>'),
      cell('Ключи — ничего не нашлось', '<div class="card">' + emptyBox('search', 'Ничего не нашлось', '') + '</div>'),
      cell('Аналитика — данных нет', '<div class="card">' + emptyBox('chart', 'Данных пока нет', 'Статистика начнёт копироваться после первого сбора', '<span class="btn">' + ic('refresh', 'i-xs') + 'Собрать сейчас</span>') + '</div>'),
      cell('Уведомления (toast)', '<div style="display:flex;flex-direction:column;gap:10px;align-items:flex-start"><span class="toast">' + ic('circle-check', 'i-s') + 'Опубликовано</span><span class="toast err">' + ic('circle-alert', 'i-s') + 'Текст длиннее 500 символов (лимит Threads)</span><span class="toast err">' + ic('circle-alert', 'i-s') + 'Фото слишком большое — выбери другое</span></div>')
    ];
    if (M) return items.slice(0, 6).join('');
    return '<div class="g-states">' + items.join('') + '</div>';
  }

  /* ---------- сборка ---------- */
  var TITLES = { posts: 'Мои посты', keywords: 'Ключи', analytics: 'Аналитика', states: 'Состояния' };
  var html = '';
  if (!M) {
    html += '<nav class="rail"><div class="r-ava">КЛ<i></i></div><div class="r-search">' + ic('search') + '</div><div class="r-mid">'
      + '<span class="r-it">' + ic('notify') + '<span class="ui-badge">3</span></span><span class="r-it">' + ic('tasks') + '</span><span class="r-it">' + ic('ticket') + '</span>'
      + '<span class="r-it">' + ic('podium') + '</span><span class="r-it is-on">' + ic('message') + '</span><span class="r-it">' + ic('mail') + '</span>'
      + '<span class="r-it">' + ic('calendar') + '</span><span class="r-it">' + ic('cash') + '</span></div>'
      + '<div class="r-act"><b>' + ic('sun') + '</b><b>' + ic('settings') + '</b><b>' + ic('plus') + '</b><b>' + ic('logout') + '</b></div></nav>';
    html += '<main class="dk"><header class="top"><nav class="crumbs"><span>Интеграции</span>' + ic('chevron', 'i-s sep') + '<span>Threads</span>' + ic('chevron', 'i-s sep') + '<b>' + TITLES[SCR] + '</b></nav>'
      + '<span class="wallet">' + ic('zap', 'i-xs') + '1 240</span></header>';
    html += '<div class="phead"><div><h1>Threads</h1><p>Постинг, статистика и поиск по ключевым словам</p></div><div class="r">' + seg() + conn(SCR === 'states') + '</div></div>';
    html += '<div class="body">';
    if (SCR === 'posts') {
      html += '<div class="g-posts"><section class="card feed"><div class="card-h"><h2>Мои посты</h2><span class="sub">15 последних</span></div><div class="feed-b">' + POSTS.map(post).join('') + '</div></section>'
        + '<div class="col"><div class="card">' + composer({ img: true }) + '</div>' + account() + '</div></div>';
    } else if (SCR === 'keywords') {
      html += '<section class="card kw"><div class="kw-top"><div class="sbar"><div class="sfield is-val">' + ic('search') + '<span>seo продвижение</span></div><span class="btn">Искать</span></div>'
        + '</div><div class="feed-b">' + KW.map(kwRow).join('') + '</div></section>';
    } else if (SCR === 'analytics') {
      html += '<div><div class="an-grid">' + AN.map(anCard).join('') + '</div>' + UPD + '</div>';
    } else {
      html += statesSheet();
    }
    html += '</div></main>';
  } else {
    html += '<div class="m"><div class="m-status"><span>9:41</span><span class="ic"><span class="bar2"><i style="height:4px"></i><i style="height:6px"></i><i style="height:9px"></i><i style="height:12px"></i></span><span class="bat"></span></span></div>'
      + '<div class="m-btns"><span class="wallet">' + ic('zap', 'i-xs') + '1 240</span><b>' + ic('settings') + '</b><b>' + ic('menu') + '</b></div>';
    var off = SCR === 'states';
    html += '<div class="m-hero"><div class="eyebrow">Интеграции</div><h1>Threads</h1><p>' + (off ? '<span class="dot err"></span><b>Не подключено</b><span class="btn" style="height:34px;padding:0 14px;border-radius:999px;font-size:13px;margin-left:auto">' + ic('link', 'i-xs') + 'Подключить</span>' : '<span class="dot"></span><b>Подключено</b> · @' + ME.username + ' · до ' + ME.exp) + '</p></div>';
    html += '<div class="m-seg">' + seg() + '</div><div class="m-body">';
    if (SCR === 'posts') {
      html += '<div class="m-card">' + composer({ empty: true }) + '</div>'
        + '<div class="m-card">' + POSTS.map(post).join('') + '</div>';
    } else if (SCR === 'keywords') {
      html += '<div class="sbar"><div class="sfield is-val">' + ic('search') + '<span>seo продвижение</span></div><span class="btn">Искать</span></div>'
        + '<div class="m-card">' + KW.map(kwRow).join('') + '</div>';
    } else if (SCR === 'analytics') {
      html += AN.map(anCard).join('') + UPD;
    } else {
      html += warn()
        + '<div class="m-card">' + composer({ empty: true, off: true }) + '</div>'
        + '<div class="m-card">' + emptyBox('link', 'Подключи Threads, чтобы увидеть посты', '') + '</div>';
    }
    html += '</div><div class="m-fade"></div><div class="m-home"></div></div>';
  }
  document.getElementById('root').innerHTML = html;
})();
</script>
</body>
</html>
