<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>

<x-dc>
<helmet>
  <style>
    /* «ДО» — побайтовая реконструкция текущего экрана статистики миссии.
       Все значения сняты с исходника: medcard_habits.js (habitOpenCard, goalStripHtml,
       heatmapHtml, drawHabitChart) и палитра C={bg,card,in,bd,tx,tx2,tx3,br,ok,wn,dg}. */
    body { margin:0; background:#0a0a0a; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
           -webkit-font-smoothing:antialiased; }
    a { color:#00a0ff; } a:hover { color:#31b6ff; }
    .mono { font-variant-numeric:tabular-nums; }
    .sheet { background:#141414; border:1px solid #262626; border-radius:18px; padding:18px; }
    .h3 { margin:0 0 4px; font-size:18px; font-weight:700; color:#e8e8e8; display:flex; align-items:center; gap:9px; }
    .mico { width:30px; height:30px; border-radius:50%; background:#00a0ff; flex-shrink:0;
            display:inline-flex; align-items:center; justify-content:center; }
    .mico svg { width:15px; height:15px; color:#fff; fill:none; stroke:currentColor;
                stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .meta { font-size:12.5px; color:#666; margin-bottom:16px; line-height:1.55; }
    /* goalStripHtml(): background C.in, border C.bd, radius 10, padding 12px 14px */
    .goal { background:#111; border:1px solid #262626; border-radius:10px; padding:12px 14px; margin-bottom:14px; }
    .goal-top { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
    .goal-lbl { font-size:11px; color:#666; text-transform:uppercase; letter-spacing:.05em; }
    .goal-pct { font-size:12.5px; font-weight:600; color:#8b8b8b; }
    .goal-big { font-size:20px; font-weight:700; color:#e8e8e8; margin-bottom:8px; }
    .goal-big span { font-size:13px; font-weight:400; color:#666; }
    .goal-track { height:6px; background:#262626; border-radius:3px; overflow:hidden; }
    .goal-fill { height:100%; width:74.4%; background:#00a0ff; border-radius:3px; }
    .goal-foot { display:flex; justify-content:space-between; font-size:11px; color:#666; margin-top:6px; }
    /* чипы чекпоинтов — inline-flex, margin 0 8px 8px 0, перенос на вторую строку */
    .cps { margin-bottom:14px; font-size:0; }
    .cp { display:inline-flex; align-items:center; gap:5px; margin:0 8px 8px 0; padding:5px 10px;
          border-radius:20px; font-size:12px; background:#1a1a1a; color:#666; border:1px solid #2c2c2c; }
    .cp.on { background:rgba(74,222,128,.12); color:#4ade80; border-color:rgba(74,222,128,.35); }
    .cp svg { width:12px; height:12px; stroke:currentColor; fill:none; stroke-width:3;
              stroke-linecap:round; stroke-linejoin:round; }
    .sec { font-size:12px; color:#8b8b8b; text-transform:uppercase; letter-spacing:.05em; margin-bottom:8px; }
    .heat { margin-bottom:14px; }
    .heat-labels { position:relative; height:13px; margin-bottom:4px; font-size:10px; color:#666; }
    .heat-grid { display:flex; gap:2px; width:max-content; }
    .heat-col { display:flex; flex-direction:column; gap:2px; }
    .heat-c { width:9px; height:9px; border-radius:2px; }
    .rng { display:flex; gap:6px; justify-content:flex-end; margin-bottom:8px; }
    .rng span { padding:4px 10px; border-radius:6px; font-size:11.5px; color:#8b8b8b; }
    .rng span.on { background:#1f1f1f; color:#e8e8e8; }
    .chart { position:relative; height:180px; background:#111; border:1px solid #262626;
             border-radius:10px; padding:10px; margin-bottom:14px; }
    .hist { font-size:12px; color:#8b8b8b; text-transform:uppercase; letter-spacing:.05em;
            margin-bottom:14px; display:flex; align-items:center; gap:6px; }
    .hist svg { width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:2;
                stroke-linecap:round; stroke-linejoin:round; transform:rotate(-90deg); }
    .hist i { color:#666; text-transform:none; letter-spacing:0; font-style:normal; }
    .acts { display:flex; gap:8px; justify-content:flex-end; }
    .tbtn { background:#1a1a1a; border:1px solid #2c2c2c; color:#e8e8e8; font-size:14px;
            padding:9px 16px; border-radius:8px; }
  </style>
</helmet>
