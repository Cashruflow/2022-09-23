<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #0f0f0f;
           font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif;
           color: #fff; -webkit-font-smoothing: antialiased; }
    a { color: #6ab0f5; text-decoration: none; }
    a:hover { color: #8cc4ff; text-decoration: underline; }
    svg { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</helmet>

<div style="width: 393px; height: 844px; background: #0f0f0f; overflow: hidden; position: relative">

  <!-- страница под шторкой -->
  <div style="padding: 26px 14px 0; filter: saturate(0.6)">
    <h1 style="margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.2; color: #fff">Продления</h1>
    <div style="margin: 4px 0 0; font-size: 15.5px; font-weight: 500; color: #8a8a93">12 сервисов · 207 480 ₽ в год</div>
    <div style="background: #141414; border: 1px solid #262626; border-radius: 14px; padding: 14px; margin-top: 20px">
      <div style="font-size: 10px; color: #8b8b8b; text-transform: uppercase; letter-spacing: 0.8px; font-weight: 700">Ближайшее продление</div>
      <div style="font-size: 24px; font-weight: 700; margin-top: 9px">07.09.2026</div>
    </div>
  </div>

  <!-- затемнение (.mask) -->
  <div style="position: absolute; inset: 0; background: rgba(0,0,0,0.6)"></div>

  <!-- нижняя шторка: та же геометрия, что у модалки задачи (ADR-064) -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 780px; background: #141414; border: 1px solid #262626; border-bottom: none; border-radius: 22px 22px 0 0; padding: 8px 14px 0; display: flex; flex-direction: column; overflow: hidden">

    <!-- ручка шторки -->
    <div style="width: 38px; height: 4px; border-radius: 2px; background: #262626; margin: 0 auto 12px; flex: 0 0 auto"></div>

    <!-- заголовок карточки -->
    <div style="display: flex; align-items: flex-start; gap: 11px; padding-bottom: 14px; border-bottom: 1px solid #262626; flex: 0 0 auto">
      <div style="width: 38px; height: 38px; flex: 0 0 38px; border-radius: 8px; background: rgba(0,160,255,0.13); color: #00a0ff; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center">R</div>
      <div style="flex: 1; min-width: 0">
        <div style="font-size: 17px; font-weight: 700; letter-spacing: -0.01em; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Сервер cashruflow</div>
        <div style="display: flex; align-items: center; gap: 6px; margin-top: 5px">
          <span style="font-size: 12px; font-weight: 600; color: #fbbf24">#1</span>
          <span style="display: inline-block; font-size: 10.5px; padding: 2px 8px; border-radius: 20px; border: 1px solid #2a2a2a; color: #aaa">Хостинг</span>
          <span style="padding: 2px 8px; border-radius: 20px; background: rgba(255,92,92,0.12); border: 1px solid rgba(255,92,92,0.28); color: #ff5c5c; font-size: 10.5px; font-weight: 600">3 дня</span>
        </div>
      </div>
      <button style="flex: 0 0 40px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: #1a1a1a; color: #8b8b8b; border: 1px solid #2a2a2a; border-radius: 10px; cursor: pointer">
        <svg width="17" height="17" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>

    <!-- поля: подпись НАД значением, один столбец, 44px контролы -->
    <div style="flex: 1 1 auto; overflow: hidden; padding-top: 14px; display: flex; flex-direction: column; gap: 12px">

      <div style="display: flex; flex-direction: column; gap: 6px">
        <label style="font-size: 11px; color: #8b8b8b; text-transform: uppercase; letter-spacing: 0.6px; font-weight: 600">Название</label>
        <div style="min-height: 44px; display: flex; align-items: center; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 10px; padding: 0 12px; font-size: 14px; color: #fff">Сервер cashruflow</div>
      </div>

      <div style="display: flex; gap: 10px">
        <div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 6px">
          <label style="font-size: 11px; color: #8b8b8b; text-transform: uppercase; letter-spacing: 0.6px; font-weight: 600">Сумма за период</label>
          <div style="min-height: 44px; display: flex; align-items: center; background: #1a1a1a; border: 1px solid rgba(0,160,255,0.4); border-radius: 10px; padding: 0 12px; font-size: 14px; color: #fff">1 200 ₽</div>
        </div>
        <div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 6px">
          <label style="font-size: 11px; color: #8b8b8b; text-transform: uppercase; letter-spacing: 0.6px; font-weight: 600">Период</label>
          <div style="min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 8px; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 10px; padding: 0 12px; font-size: 14px; color: #fff">
            месяц
            <svg width="15" height="15" viewBox="0 0 24 24" style="color: #6a6a6a; flex: 0 0 15px"><path d="m6 9 6 6 6-6"/></svg>
          </div>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px">
        <label style="font-size: 11px; color: #8b8b8b; text-transform: uppercase; letter-spacing: 0.6px; font-weight: 600">Цена без скидки</label>
        <div style="min-height: 44px; display: flex; align-items: center; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 10px; padding: 0 12px; font-size: 14px; color: #fff">1 490 ₽</div>
        <div style="font-size: 11.5px; color: #8b8b8b; padding-left: 2px">скидка <b style="color: #4caf7d">290 ₽</b> · 19% · 3 480 ₽ в год</div>
      </div>

      <div style="display: flex; gap: 10px">
        <div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 6px">
          <label style="font-size: 11px; color: #8b8b8b; text-transform: uppercase; letter-spacing: 0.6px; font-weight: 600">Оплачено до</label>
          <div style="min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 8px; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 10px; padding: 0 12px; font-size: 14px; color: #fff">
            14.09.2026
            <svg width="15" height="15" viewBox="0 0 24 24" style="color: #6a6a6a; flex: 0 0 15px"><rect x="3" y="4.5" width="18" height="17" rx="2.5"/><path d="M16 2.5v4M8 2.5v4M3 10h18"/></svg>
          </div>
        </div>
        <div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 6px">
          <label style="font-size: 11px; color: #8b8b8b; text-transform: uppercase; letter-spacing: 0.6px; font-weight: 600">Статус</label>
          <div style="min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 8px; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 10px; padding: 0 12px; font-size: 14px; color: #fff">
            Активен
            <svg width="15" height="15" viewBox="0 0 24 24" style="color: #6a6a6a; flex: 0 0 15px"><path d="m6 9 6 6 6-6"/></svg>
          </div>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px">
        <label style="font-size: 11px; color: #8b8b8b; text-transform: uppercase; letter-spacing: 0.6px; font-weight: 600">Проект</label>
        <div style="min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 8px; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 10px; padding: 0 12px; font-size: 14px; color: #8b8b8b">
          — личное —
          <svg width="15" height="15" viewBox="0 0 24 24" style="color: #6a6a6a; flex: 0 0 15px"><path d="m6 9 6 6 6-6"/></svg>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 11px; min-height: 44px">
        <span style="width: 20px; height: 20px; flex: 0 0 20px; border-radius: 5px; background: #00a0ff; display: flex; align-items: center; justify-content: center; color: #04121e">
          <svg width="13" height="13" viewBox="0 0 24 24" style="stroke-width: 3"><path d="m5 12.5 4.5 4.5L19 7"/></svg>
        </span>
        <span style="font-size: 14px; color: #ddd">Списывается автоматически</span>
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px">
        <label style="font-size: 11px; color: #8b8b8b; text-transform: uppercase; letter-spacing: 0.6px; font-weight: 600">Поставщик</label>
        <div style="min-height: 44px; display: flex; align-items: center; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 10px; padding: 0 12px; font-size: 14px; color: #fff">RUVDS</div>
      </div>

    </div>

    <!-- футер шторки закреплён -->
    <div style="flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 12px 0 24px; border-top: 1px solid #262626; background: #141414">
      <button style="flex: 1 1 0; min-height: 44px; background: #00a0ff; color: #04121e; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer">Сохранить</button>
      <button style="flex: 0 0 auto; min-height: 44px; padding: 0 16px; background: #1a1a1a; color: #ddd; border: 1px solid #2a2a2a; border-radius: 10px; font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer">Отмена</button>
      <button style="flex: 0 0 44px; width: 44px; min-height: 44px; display: flex; align-items: center; justify-content: center; background: #1a1a1a; color: #ff7b7b; border: 1px solid #2a2a2a; border-radius: 10px; cursor: pointer">
        <svg width="17" height="17" viewBox="0 0 24 24"><path d="M3.5 6h17M8.5 6V4h7v2M18.5 6l-1 14h-11l-1-14"/></svg>
      </button>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
