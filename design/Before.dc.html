      </div>
    </div>

    <div style="background: #ffffff; border-radius: 14px; padding: 14px 16px; display: flex; align-items: center; gap: 14px">
      <div style="width: 10px; height: 10px; border-radius: 5px; background: #5e5ce6; flex-shrink: 0"></div>
      <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
        <div style="font-size: 16px; font-weight: 500">Чтение 20 минут</div>
        <div style="font-size: 13px; color: #8e8e93">Серия: 6 дней</div>
      </div>
      <div style="width: 26px; height: 26px; border-radius: 13px; background: #5e5ce6; display: flex; align-items: center; justify-content: center">

  <div style="margin-top: auto; background: #ffffff; border-top: 1px solid #e5e5ea; margin-left: -20px; margin-right: -20px; padding: 12px 24px 30px; display: flex; justify-content: space-between; align-items: center">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4f7cf7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"></rect><path d="M8 2v4M16 2v4M3 10h18"></path></svg>
      <div style="font-size: 11px; color: #4f7cf7">Сегодня</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8e8e93" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"></path></svg>
      <div style="font-size: 11px; color: #8e8e93">Статистика</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px">

</div>
