<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Threads — AI-платформа</title>
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
<link rel="stylesheet" href="/ui.css?v=106">
<link rel="stylesheet" href="/theme.css">
<style>
/* Шапку собирает /page-header.js из родного <header>: <h1> + <p class="ph-s">, остальное
   (вкладки #th-tabs и статус #th-status) уезжает в ряд .ph-tools — на ПК справа от
   заголовка, на телефоне под подзаголовком (ADR-147). Своей вёрстки шапки здесь нет.
   Гейт страниц (page_gate.js) закрывает /threads по умолчанию — отдельно вписывать никуда не нужно.
   Редизайн 28.10.2026 (макет threads-redesign): только вид. Цвета — только токены --ui-*,
   кнопки — роли .btn/.tbtn/.btn-sm без своих стилей, поля — inpCss(). */
html, body { max-width: 100vw; overflow-x: clip; }
body { margin: 0; }
#app { display: block; }
.th-i { width: 16px; height: 16px; flex: 0 0 auto; fill: none; stroke: currentColor; }

/* ---------- шапка: статус подключения (капсула на ПК, строка на телефоне) ---------- */
.th-conn { display: inline-flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 6px 0 14px; box-sizing: border-box;
  border-radius: 999px; background: var(--ui-card-bg); border: 1px solid var(--ui-card-border); box-shadow: var(--ui-shadow-sm);
  font-size: 13px; color: var(--ui-tx-2); min-width: 0; }
.th-conn:not(:has(#th-connect:not([hidden]))) { padding-right: 16px; }
.th-conn__t { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 0 8px; min-width: 0; }
.th-conn__t b { color: var(--ui-tx); font-weight: 600; }
.th-conn__t .th-sep { color: var(--ui-tx-3); }
.th-dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; background: var(--ui-tx-3); }
.th-dot.ok { background: var(--ui-ok); box-shadow: 0 0 0 3px var(--ui-ok-soft); }
.th-dot.err { background: var(--ui-danger); box-shadow: 0 0 0 3px var(--ui-danger-soft); }
#th-tabs { flex: 0 1 auto; }

/* ---------- плашка «Нет прав на статистику» (ERR-193), прячется атрибутом hidden ---------- */
#th-noins:not([hidden]) { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: var(--ui-gap, 16px);
  padding: 12px 12px 12px 16px; border-radius: var(--ui-card-radius, 12px);
  background: var(--ui-danger-soft); border: 1px solid var(--ui-danger-soft-line); }
.th-warn__ico { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; flex: 0 0 auto;
  background: color-mix(in srgb, var(--ui-danger) 16%, var(--ui-card-bg)); color: var(--ui-danger-soft-tx); }
.th-warn__t { flex: 1 1 220px; min-width: 0; font-size: 13.5px; color: var(--ui-tx); }
.th-warn__t small { display: block; font-size: 12.5px; color: var(--ui-tx-2); }

/* ---------- карточки ---------- */
.th-card { box-shadow: var(--ui-shadow-sm); min-width: 0; }
.th-card__h { display: flex; align-items: baseline; gap: 10px; margin: 0 0 6px; }
.th-h2 { margin: 0; font-size: 17px; font-weight: 700; color: var(--ui-tx); }
.th-card__sub { font-size: 12.5px; color: var(--ui-tx-3); }

/* «Мои посты»: лента + «Новый пост». ПК (≥1101) — две колонки, «Новый пост» справа и липкий;
   уже — одна колонка, «Новый пост» сверху. Флексом, без своего grid-template-columns (ADR-341). */
.th-grid { display: flex; flex-direction: column; gap: var(--ui-gap, 16px); }
.th-feed { flex: 1 1 auto; }
@media (min-width: 1101px) {
  .th-grid { flex-direction: row; align-items: flex-start; }
  .th-feed { order: 1; flex: 1 1 0; }
  #th-compose { order: 2; flex: 0 0 408px; position: sticky; top: calc(var(--th-sticky, 0px) + 12px); }
}

/* ---------- композер ---------- */
#th-compose { display: flex; flex-direction: column; gap: 12px; }
.th-who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.th-who b { display: block; font-size: 15px; color: var(--ui-tx); }
.th-who small { display: block; font-size: 12px; color: var(--ui-tx-3); }
#th-text { width: 100%; box-sizing: border-box; min-height: 132px; resize: vertical; }
#th-preview { position: relative; }
#th-preview[hidden], #th-img-file[hidden] { display: none; }
#th-preview img { display: block; width: 100%; max-height: 260px; object-fit: cover; border-radius: var(--ui-card-radius, 12px);
  border: 1px solid var(--ui-line-2); }
.th-prev-rm { position: absolute; top: 8px; right: 8px; border-radius: var(--ui-radius, 8px); background: var(--ui-card-bg); box-shadow: var(--ui-shadow-sm); }
#th-foot { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.th-count { display: inline-flex; align-items: center; gap: 7px; flex: 0 0 auto; white-space: nowrap;
  font-size: 12.5px; color: var(--ui-tx-3); font-variant-numeric: tabular-nums; }
.th-ring { position: relative; width: 20px; height: 20px; border-radius: 50%; flex: 0 0 auto;
  background: conic-gradient(var(--ui-brand) calc(var(--p, 0) * 1%), var(--ui-line) 0); }
.th-ring::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--ui-card-bg); }
.th-count.over { color: var(--ui-danger); }
.th-count.over .th-ring { background: var(--ui-danger); }
#th-post { margin-left: auto; }

/* ---------- аватары: свой — бренд, чужие — мягкие тона по нику ---------- */
.th-av { --s: 40px; width: var(--s); height: var(--s); border-radius: 50%; flex: 0 0 auto; display: inline-grid; place-items: center;
  font-size: calc(var(--s) * .36); font-weight: 600; letter-spacing: .02em;
  background: var(--ui-surface-2); color: var(--ui-tx-2); }
.th-av.is-me { background: var(--ui-brand); color: var(--ui-btn1-text, #04121e); }
.th-av.is-c0 { background: var(--ui-brand-soft); color: var(--ui-brand-soft-tx); }
.th-av.is-c1 { background: var(--ui-ok-soft); color: var(--ui-ok-soft-tx); }
.th-av.is-c2 { background: var(--ui-warn-soft); color: var(--ui-warn-soft-tx); }
.th-av.is-c3 { background: var(--ui-violet-soft); color: var(--ui-violet-soft-tx); }
.th-av.is-sm { --s: 28px; }

/* ---------- пост в ленте (свои посты и результаты поиска) ---------- */
#th-posts, #th-search-results { display: flex; flex-direction: column; }
.th-post { position: relative; display: flex; gap: 12px; padding: 14px 0 12px; }
.th-post + .th-post::before { content: ""; position: absolute; left: 52px; right: 0; top: 0; height: 1px; background: var(--ui-line-2); }
.th-post__l { display: flex; flex-direction: column; align-items: center; flex: 0 0 40px; }
.th-post:has(.th-post__replies.is-open) .th-post__l::after { content: ""; flex: 1 1 auto; width: 2px; min-height: 12px; margin-top: 6px;
  border-radius: 2px; background: var(--ui-line); }
.th-post__b { flex: 1 1 auto; min-width: 0; }
.th-post__h { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 13px; color: var(--ui-tx-3); }
.th-post__name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14.5px; font-weight: 600; color: var(--ui-tx); }
.th-post__time { flex: 0 0 auto; white-space: nowrap; }
.th-tag { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border-radius: 6px;
  background: var(--ui-surface-2); color: var(--ui-tx-2); font-size: 11.5px; font-weight: 500; }
.th-tag .th-i { width: 12px; height: 12px; }
.th-open { margin-left: auto; flex: 0 0 auto; display: inline-flex; align-items: center; gap: 5px; color: var(--ui-tx-2);
  font-size: 12.5px; font-weight: 500; text-decoration: none; }
.th-open:hover { color: var(--ui-brand); }
.th-open .th-i { width: 15px; height: 15px; }
.th-post__text { margin-top: 3px; font-size: 14.5px; line-height: 1.5; color: var(--ui-tx); white-space: pre-wrap; word-break: break-word; }
.th-post__text.is-empty { color: var(--ui-tx-3); font-style: italic; }
.th-post__meta { display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap; margin-top: 8px; }
.th-post__stats { display: flex; align-items: center; flex-wrap: wrap; gap: 2px 14px; min-width: 0; flex: 1 1 auto; }
.th-post__stats:empty { display: none; }
.th-stat { display: inline-flex; align-items: center; gap: 5px; min-height: 28px; white-space: nowrap; font-size: 13px;
  color: var(--ui-tx-3); font-variant-numeric: tabular-nums; }
.th-stat .th-i { color: var(--ui-tx-2); }
.th-stat b { color: var(--ui-tx); font-weight: 600; }
.th-stat.is-na { font-size: 12.5px; }
.th-sk { width: 220px; max-width: 100%; height: 12px; margin: 8px 0; }
.th-post__meta > .tbtn { margin-left: auto; }
/* ответы — ветка под постом */
.th-post__replies { margin-top: 10px; display: none; font-size: 13.5px; color: var(--ui-tx-3); }
.th-post__replies.is-open { display: block; }
.th-reply { display: flex; gap: 10px; padding: 6px 0 4px; }
.th-reply__b { min-width: 0; font-size: 13.5px; line-height: 1.45; color: var(--ui-tx); word-break: break-word; }
.th-reply__b b { font-weight: 600; margin-right: 4px; }
.th-reply__b small { font-size: 12px; color: var(--ui-tx-3); }

/* ---------- поиск по ключам ---------- */
.th-search-row { gap: 10px; align-items: center; }
.th-search-row input { flex: 1 1 240px; min-width: 0; }
#th-search-results { margin-top: 6px; }

/* ---------- пустые состояния (общий .ui-empty) — значок в плитке ---------- */
.th-empty .ui-empty__ico { box-sizing: border-box; width: 48px; height: 48px; padding: 13px; border-radius: 16px;
  background: var(--ui-surface-2); color: var(--ui-tx-3); }

/* ---------- телефон ---------- */
@media (max-width: 768px) {
  #th-status { order: -1; flex: 1 1 100%; min-height: 0; padding: 0; border: 0; border-radius: 0; background: transparent; box-shadow: none; font-size: 14px; }
  #th-tabs { flex: 1 1 100%; }
  #th-tabs .ui-tab > svg { display: none; }
  .th-card { border-radius: var(--ui-sheet-radius, 22px); }
  .th-post { padding: 14px 0 10px; }
  .th-post__text { font-size: 15px; }
  .th-post__stats { gap: 0 12px; }
  .th-stat { min-height: 26px; font-size: 12.5px; }
  .th-post__meta > .tbtn { margin-left: 0; }
  .th-warn__t { flex-basis: 200px; }
  #th-noins .btn { flex: 1 1 100%; }
  #th-text { min-height: 72px; }
  #th-post { flex: 1 1 100%; }
  .th-exp-w, .th-open__l { display: none; }
  .th-open { min-width: 28px; min-height: 28px; justify-content: flex-end; }
}
</style>
</head>
<body>

<div id="app" class="ui-page">
  <header>
    <h1>Threads</h1>
    <p class="ph-s">Постинг, статистика и поиск по ключевым словам</p>
    <div class="ui-tabs" id="th-tabs">
      <a href="#posts" class="ui-tab" data-tab="posts"><svg class="th-i" aria-hidden="true"><use href="/assets/icons.svg#i-newspaper"></use></svg>Мои посты</a>
      <a href="#keywords" class="ui-tab" data-tab="keywords"><svg class="th-i" aria-hidden="true"><use href="/assets/icons.svg#i-search"></use></svg>Ключи</a>
      <a href="#аналитика" class="ui-tab" data-tab="аналитика"><svg class="th-i" aria-hidden="true"><use href="/assets/icons.svg#i-chart"></use></svg>Аналитика</a>
    </div>
    <div id="th-status" class="th-conn" role="status">
      <span class="th-dot" id="th-dot"></span>
      <span class="th-conn__t" id="th-txt">Проверяю…</span>
      <button type="button" class="btn btn-sm" id="th-connect" hidden><svg class="th-i" aria-hidden="true"><use href="/assets/icons.svg#i-link"></use></svg>Подключить</button>
    </div>
  </header>

  <div id="th-noins" hidden>
    <span class="th-warn__ico"><svg class="th-i" aria-hidden="true"><use href="/assets/icons.svg#i-circle-alert"></use></svg></span>
    <span class="th-warn__t">Нет прав на статистику Threads<small>Переподключите Threads с правом insights</small></span>
    <button type="button" class="btn btn-sm" id="th-reconnect"><svg class="th-i" aria-hidden="true"><use href="/assets/icons.svg#i-refresh"></use></svg>Переподключить</button>
  </div>

  <div id="tab-analytics" hidden>
    <div id="th-analytics"></div>
  </div>

  <div id="tab-posts">
    <div class="th-grid">
      <section id="th-compose" class="ui-card th-card">
        <div class="th-who">
          <span class="th-av is-me" id="th-me-av" aria-hidden="true">TH</span>
          <div><b>Новый пост</b><small id="th-me">Threads</small></div>
        </div>
        <textarea id="th-text" maxlength="500" placeholder="О чём напишем в Threads?" data-no-fl></textarea>
        <div id="th-preview" hidden><img id="th-preview-img" alt=""><div class="th-prev-rm"><button type="button" class="tbtn btn-sm rm" id="th-img-rm"><svg class="th-i" aria-hidden="true"><use href="/assets/icons.svg#i-close"></use></svg>Убрать картинку</button></div></div>
        <div id="th-foot">
          <input type="file" id="th-img-file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
          <button type="button" class="tbtn" id="th-img-btn"><svg class="th-i" aria-hidden="true"><use href="/assets/icons.svg#i-image"></use></svg>Картинка</button>
          <span id="th-count" class="th-count"><span class="th-ring" aria-hidden="true"></span><span id="th-count-n">0 / 500</span></span>
          <button type="button" class="btn" id="th-post"><svg class="th-i" aria-hidden="true"><use href="/assets/icons.svg#i-send"></use></svg><span id="th-post-l">Опубликовать</span></button>
        </div>
      </section>

      <section class="ui-card th-card th-feed">
        <div class="th-card__h"><h2 class="th-h2">Мои посты</h2><span class="th-card__sub" id="th-posts-n"></span></div>
        <div id="th-posts">Загрузка…</div>
      </section>
    </div>
  </div>

  <div id="tab-keywords" hidden>
    <section class="ui-card th-card">
      <div class="ui-row th-search-row">
        <input id="th-q" placeholder="фраза или тема">
        <button type="button" class="btn" id="th-search-btn"><svg class="th-i" aria-hidden="true"><use href="/assets/icons.svg#i-search"></use></svg>Искать</button>
      </div>
      <div id="th-search-results"></div>
    </section>
  </div>
</div>

<script src="/toast.js"></script>
<script src="/loc-time.js?v=1"></script>
<script src="/threads-analytics-widget.js?v=4"></script>
<script>
(function () {
  const dot = document.getElementById('th-dot');
  const txt = document.getElementById('th-txt');
  const connectBtn = document.getElementById('th-connect');
  const ta = document.getElementById('th-text');
  const count = document.getElementById('th-count');
  const countN = document.getElementById('th-count-n');
  const postBtn = document.getElementById('th-post');
  const postLbl = document.getElementById('th-post-l');
  const imgBtn = document.getElementById('th-img-btn');
  const imgFile = document.getElementById('th-img-file');
  const preview = document.getElementById('th-preview');
  const previewImg = document.getElementById('th-preview-img');
  const imgRm = document.getElementById('th-img-rm');
  let imageB64 = '';
  let me = ''; // @username аккаунта из /api/threads/status (live.username), без «@»

  function toast(msg, err) { window.pltToast ? pltToast(msg, { err: !!err }) : (err ? alert(msg) : null); }

  // ---------- вид: значки, склонение, время, аватары ----------
  const SPR = window.ICONS_URL || '/assets/icons.svg';
  function ico(id) { return '<svg class="th-i" aria-hidden="true"><use href="' + SPR + '#' + id + '"></use></svg>'; }
  // склонение — та же формула, что в analytics_app.js / seo-v2.js (общего модуля на платформе нет)
  function plural(n, a, b, c) { var m = Math.abs(n) % 100, k = m % 10; return m > 10 && m < 20 ? c : k === 1 ? a : k > 1 && k < 5 ? b : c; }
  function num(n) { return Number(n).toLocaleString('ru-RU'); }
  function ini(name) { const s = String(name || '').replace(/^@+/, '').replace(/[^0-9A-Za-zА-Яа-яЁё]/g, ''); return (s.slice(0, 2) || 'TH').toUpperCase(); }
  function tone(name) { let h = 0; String(name || '').split('').forEach(ch => { h = (h * 31 + ch.charCodeAt(0)) >>> 0; }); return 'is-c' + (h % 4); }
  function dkey(d) { return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate(); }
  // «сегодня, 14:32» / «вчера, 18:05» / «24.10, 11:40» (другой год — с годом)
  function when(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    if (isNaN(d)) return '';
    const now = new Date(), y = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1);
    const hm = d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    if (dkey(d) === dkey(now)) return 'сегодня, ' + hm;
    if (dkey(d) === dkey(y)) return 'вчера, ' + hm;
    const o = { day: '2-digit', month: '2-digit' };
    if (d.getFullYear() !== now.getFullYear()) o.year = 'numeric';
    return d.toLocaleDateString('ru-RU', o) + ', ' + hm;
  }
  function full(ts) { const d = ts ? new Date(ts) : null; return d && !isNaN(d) ? d.toLocaleString('ru-RU') : ''; }
  function empty(box, icon, title, sub) {
    box.innerHTML = '<div class="ui-empty is-c th-empty">' + '<svg class="ui-empty__ico" aria-hidden="true"><use href="' + SPR + '#' + icon + '"></use></svg>'
      + '<b class="ui-empty__t">' + esc(title) + '</b>' + (sub ? '<p class="ui-empty__s">' + esc(sub) + '</p>' : '') + '</div>';
  }
  function paintMe() {
    document.getElementById('th-me').textContent = me ? '@' + me + ' · Threads' : 'Threads';
    document.getElementById('th-me-av').textContent = ini(me);
  }

  // липкий «Новый пост» на ПК встаёт под липкую шапку .ph — её высоту держим в --th-sticky
  (function stickyTop() {
    const app = document.getElementById('app');
    let tries = 0;
    function set(h) { app.style.setProperty('--th-sticky', (h && getComputedStyle(h).position === 'sticky' ? h.offsetHeight : 0) + 'px'); }
    function find() {
      const h = document.querySelector('header.ph');
      if (!h) { if (++tries < 40) setTimeout(find, 250); return; }
      set(h);
      if (window.ResizeObserver) new ResizeObserver(() => set(h)).observe(h);
      window.addEventListener('resize', () => set(h));
    }
    find();
  })();

  function refreshStatus() {
    fetch('/api/threads/status').then(r => r.json()).then(d => {
      if (d.connected) {
        me = (d.live && d.live.username) || '';
        dot.className = 'th-dot ok';
        const exp = d.expires_at ? (window.locDate ? window.locDate(d.expires_at) : d.expires_at) : '';
        txt.innerHTML = '<b>Подключено</b>' + (me ? '<span class="th-sep">·</span><span>@' + esc(me) + '</span>' : '')
          + (exp ? '<span class="th-sep">·</span><span><span class="th-exp-w">токен </span>до ' + esc(exp) + '</span>' : '');
        connectBtn.hidden = true;
        postBtn.disabled = false;
        paintMe();
        loadPosts();
      } else {
        me = '';
        dot.className = 'th-dot err';
        txt.innerHTML = '<b>Не подключено</b>';
        connectBtn.hidden = false;
        postBtn.disabled = true;
        paintMe();
        document.getElementById('th-posts-n').textContent = '';
        empty(document.getElementById('th-posts'), 'i-link', 'Подключи Threads, чтобы увидеть посты');
      }
    }).catch(() => { txt.textContent = 'Не удалось проверить статус'; });
  }
  connectBtn.onclick = () => { location.href = '/api/threads/oauth/start'; };

  // ERR-193: нет права threads_manage_insights — плашка один раз, дальше статистику не спрашиваем
  let insightsDenied = false;
  function noInsights() {
    insightsDenied = true;
    document.getElementById('th-noins').hidden = false;
  }
  document.getElementById('th-reconnect').onclick = () => { location.href = '/api/threads/oauth/start'; };

  function updCount() {
    const n = ta.value.length;
    countN.textContent = n + ' / 500';
    count.style.setProperty('--p', Math.min(100, Math.round(n / 5)));
    count.classList.toggle('over', n > 500);
  }
  ta.addEventListener('input', updCount);

  imgBtn.onclick = () => imgFile.click();
  imgFile.onchange = () => {
    const f = imgFile.files[0];
    if (!f) return;
    compressImage(f).then(url => { imageB64 = url; previewImg.src = imageB64; preview.hidden = false; })
      .catch(e => { imgFile.value = ''; toast(e.message || 'Не удалось обработать картинку', true); });
  };
  // ERR-509: общий express.json() пускает ~100 КБ — сжимаем через canvas в JPEG, сторона ≤1280px, base64 ≤ ~70 КБ
  const PHOTO_MAX = 70 * 1024, PHOTO_SIDE = 1280;
  function compressImage(file) {
    return new Promise((resolve, reject) => {
      const src = URL.createObjectURL(file);
      const img = new Image();
      img.onerror = () => { URL.revokeObjectURL(src); reject(new Error('Не удалось прочитать картинку')); };
      img.onload = () => {
        URL.revokeObjectURL(src);
        let scale = Math.min(1, PHOTO_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
        for (let step = 0; step < 6; step++) {
          const cv = document.createElement('canvas');
          cv.width = Math.max(1, Math.round(img.naturalWidth * scale));
          cv.height = Math.max(1, Math.round(img.naturalHeight * scale));
          const cx = cv.getContext('2d');
          cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); // прозрачность PNG/WebP иначе станет чёрной
          cx.drawImage(img, 0, 0, cv.width, cv.height);
          let done = '';
          for (const q of [0.85, 0.7, 0.55, 0.4]) {
            const out = cv.toDataURL('image/jpeg', q);
            if (out.length <= PHOTO_MAX) { done = out; break; }
          }
          cv.width = cv.height = 0; // освобождаем память canvas (iOS держит её до GC)
          if (done) return resolve(done);
          scale *= 0.75; // качества не хватило — уменьшаем размер
        }
        reject(new Error('Фото слишком большое — выбери другое'));
      };
      img.src = src;
    });
  }
  imgRm.onclick = () => { imageB64 = ''; imgFile.value = ''; preview.hidden = true; };

  postBtn.onclick = () => {
    const text = ta.value.trim();
    if (!text && !imageB64) return;
    postBtn.disabled = true;
    postLbl.textContent = 'Публикую…';
    fetch('/api/threads/post', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, image_base64: imageB64 || undefined })
    }).then(r => r.text().then(t => {
      let d; try { d = JSON.parse(t); } catch (e) { d = null; }  // 413 приходит HTML-страницей, не JSON
      if (!d) d = { error: r.status === 413 ? 'Фото слишком большое' : 'Ошибка сервера (' + r.status + ')' };
      return d;
    })).then(d => {
      postBtn.disabled = false; postLbl.textContent = 'Опубликовать';
      if (d.ok) {
        toast('Опубликовано');
        ta.value = ''; updCount(); imgRm.onclick();
        loadPosts();
      } else toast(d.error || 'Ошибка публикации', true);
    }).catch(e => { postBtn.disabled = false; postLbl.textContent = 'Опубликовать'; toast(e.message, true); });
  };

  // ---------- поиск ----------
  const qInput = document.getElementById('th-q');
  const searchBtn = document.getElementById('th-search-btn');
  const results = document.getElementById('th-search-results');
  function doSearch() {
    const q = qInput.value.trim();
    if (!q) return;
    empty(results, 'i-search', 'Ищу…');
    fetch('/api/threads/search?q=' + encodeURIComponent(q)).then(r => r.json()).then(d => {
      if (d.error) { results.textContent = ''; return toast(d.error, true); }
      if (!d.items.length) { empty(results, 'i-search', 'Ничего не нашлось'); return; }
      results.innerHTML = d.items.map(it => {
        const u = it.username || '';
        return `
        <div class="th-post">
          <div class="th-post__l"><span class="th-av ${tone(u)}" aria-hidden="true">${esc(ini(u))}</span></div>
          <div class="th-post__b">
            <div class="th-post__h">
              <b class="th-post__name">@${esc(u || '—')}</b>
              <span class="th-post__time" title="${esc(full(it.timestamp))}">${esc(when(it.timestamp))}</span>
              ${it.permalink ? `<a class="th-open" href="${it.permalink}" target="_blank" rel="noopener" aria-label="Открыть в Threads"><span class="th-open__l">Открыть</span>${ico('i-external-link')}</a>` : ''}
            </div>
            <div class="th-post__text">${esc(it.text || '')}</div>
          </div>
        </div>`;
      }).join('');
    }).catch(e => { results.textContent = ''; toast(e.message, true); });
  }
  searchBtn.onclick = doSearch;
  qInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

  // ---------- мои посты ----------
  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
  // счётчики: значок + число + подпись словами со склонением (1 лайк / 2 лайка / 5 лайков)
  const STAT_F = [
    ['views', 'i-eye', ['просмотр', 'просмотра', 'просмотров']],
    ['likes', 'i-heart', ['лайк', 'лайка', 'лайков']],
    ['replies', 'i-message', ['ответ', 'ответа', 'ответов']],
    ['reposts', 'i-repeat-2', ['репост', 'репоста', 'репостов']],
    ['quotes', 'i-text-quote', ['цитата', 'цитаты', 'цитат']]
  ];
  const statsHtml = s => STAT_F.map(f => {
    const x = s[f[0]], n = x == null || x === '' || !isFinite(Number(x)) ? null : Number(x);
    const w = n == null ? f[2][2] : plural(n, f[2][0], f[2][1], f[2][2]);
    return '<span class="th-stat">' + ico(f[1]) + '<b>' + (n == null ? '—' : num(n)) + '</b>' + w + '</span>';
  }).join('');
  function loadPosts() {
    const box = document.getElementById('th-posts');
    const cnt = document.getElementById('th-posts-n');
    box.textContent = 'Загрузка…';
    fetch('/api/threads/posts').then(r => r.json()).then(d => {
      if (d.error) { box.textContent = ''; return toast(d.error, true); }
      const n = d.items.length;
      cnt.textContent = n ? n + ' ' + plural(n, 'последний', 'последних', 'последних') : '';
      if (!n) { empty(box, 'i-newspaper', 'Постов пока нет'); return; }
      const name = me || 'Вы';
      box.innerHTML = d.items.map(p => {
        const rp = p.media_type === 'REPOST_FACADE';
        return `
        <div class="th-post" data-id="${p.id}">
          <div class="th-post__l"><span class="th-av is-me" aria-hidden="true">${esc(ini(me))}</span></div>
          <div class="th-post__b">
            <div class="th-post__h">
              <b class="th-post__name">${esc(name)}</b>
              ${rp ? `<span class="th-tag">${ico('i-repeat-2')}репост</span>` : ''}
              <span class="th-post__time" title="${esc(full(p.timestamp))}">${esc(when(p.timestamp))}</span>
              ${p.permalink ? `<a class="th-open" href="${p.permalink}" target="_blank" rel="noopener" aria-label="Открыть в Threads"><span class="th-open__l">Открыть</span>${ico('i-external-link')}</a>` : ''}
            </div>
            <div class="th-post__text${p.text ? '' : ' is-empty'}">${esc(p.text || '(без текста)')}</div>
            <div class="th-post__meta">
              <div class="th-post__stats" id="stats-${p.id}"><span class="ui-sk th-sk"></span></div>
              <button type="button" class="tbtn btn-sm th-show-replies" aria-expanded="false">${ico('i-message')}<span class="th-rl">Ответы</span></button>
            </div>
            <div class="th-post__replies" id="replies-${p.id}"></div>
          </div>
        </div>`;
      }).join('');
      // ERR-193: статистику по репостам (REPOST_FACADE) Meta не отдаёт — не спрашиваем.
      // Запросы идут по очереди: первый ответ с code no_insights_permission останавливает
      // остальные и один раз показывает плашку «Переподключить» (вместо 15 одинаковых отказов).
      const queue = d.items.filter(p => p.media_type !== 'REPOST_FACADE');
      d.items.forEach(p => {
        if (p.media_type === 'REPOST_FACADE') { const el = document.getElementById('stats-' + p.id); if (el) el.innerHTML = '<span class="th-stat is-na">' + ico('i-info') + 'Репост — статистики нет</span>'; }
      });
      if (insightsDenied) {
        queue.forEach(q => { const e2 = document.getElementById('stats-' + q.id); if (e2) e2.textContent = ''; });
        queue.length = 0;
      }
      const next = () => {
        const p = queue.shift();
        if (!p) return;
        const el = document.getElementById('stats-' + p.id);
        fetch('/api/threads/insights?id=' + encodeURIComponent(p.id))
          .then(r => r.json().catch(() => ({})).then(s => ({ ok: r.ok, s })))
          .then(({ ok, s }) => {
            if (s.code === 'no_insights_permission') {
              noInsights();
              queue.concat([p]).forEach(q => { const e2 = document.getElementById('stats-' + q.id); if (e2) e2.textContent = ''; });
              return;
            }
            if (el) { if (ok && !s.error) el.innerHTML = statsHtml(s); else el.textContent = ''; }
            next();
          })
          .catch(() => { if (el) el.textContent = ''; next(); });
      };
      next();
      box.querySelectorAll('.th-show-replies').forEach(btn => {
        const lbl = btn.querySelector('.th-rl');
        btn.onclick = () => {
          const id = btn.closest('.th-post').dataset.id;
          const el = document.getElementById('replies-' + id);
          if (el.classList.contains('is-open')) { el.classList.remove('is-open'); btn.setAttribute('aria-expanded', 'false'); lbl.textContent = 'Ответы'; return; }
          el.classList.add('is-open');
          btn.setAttribute('aria-expanded', 'true'); lbl.textContent = 'Скрыть ответы';
          el.textContent = 'Загрузка…';
          fetch('/api/threads/replies?id=' + id).then(r => r.json()).then(d2 => {
            if (d2.error) { el.textContent = ''; return toast(d2.error, true); }
            el.innerHTML = d2.items.length
              ? d2.items.map(rp => {
                const u = rp.username || '';
                return `<div class="th-reply"><span class="th-av is-sm ${tone(u)}" aria-hidden="true">${esc(ini(u))}</span>`
                  + `<div class="th-reply__b"><b>@${esc(u || '—')}</b><small title="${esc(full(rp.timestamp))}">${esc(when(rp.timestamp))}</small><div>${esc(rp.text || '')}</div></div></div>`;
              }).join('')
              : 'Ответов пока нет';
          }).catch(e => { el.textContent = ''; toast(e.message, true); });
        };
      });
    }).catch(e => { box.textContent = ''; toast(e.message, true); });
  }

  refreshStatus();
  updCount();

  // ---------- вкладки #posts / #keywords ----------
  const tabs = document.querySelectorAll('#th-tabs .ui-tab');
  const panels = { posts: document.getElementById('tab-posts'), keywords: document.getElementById('tab-keywords'), 'аналитика': document.getElementById('tab-analytics') };
  let analyticsLoaded = false;
  function showTab(name) {
    try { name = decodeURIComponent(name); } catch (e) {}
    // белый список — Object.hasOwn: #constructor / #toString не должны находить «панель» в прототипе
    if (!Object.hasOwn(panels, name)) name = 'posts';
    if (name === 'аналитика' && !analyticsLoaded && window.renderThreadsAnalytics) {
      analyticsLoaded = true;
      window.renderThreadsAnalytics(document.getElementById('th-analytics'), { onNoInsights: noInsights });
    }
    // активная вкладка — .is-on (ui.css, .ui-tab.is-on); с .is-active подсветки не было
    tabs.forEach(t => { const on = t.dataset.tab === name; t.classList.toggle('is-on', on); t.setAttribute('aria-current', on ? 'page' : 'false'); });
    Object.keys(panels).forEach(k => { panels[k].hidden = k !== name; });
  }
  tabs.forEach(t => t.addEventListener('click', e => { e.preventDefault(); location.hash = t.dataset.tab; showTab(t.dataset.tab); }));
  // адрес — источник правды: «назад»/«вперёд» и ручная правка #хэша тоже переключают вкладку
  window.addEventListener('hashchange', () => showTab((location.hash || '#posts').slice(1)));
  showTab((location.hash || '#posts').slice(1));
})();
</script>
