<!--
  Карточка услуги компании: логотип, название, категория, описание услуги, локация с акцентом.
  Опциональные элементы: логотип (если нет - карточка сжимается), бэдж (для показа рейтинга/метрики).
  Обязательные: компания, уровень (категория), роль (название услуги), локация, кнопки.
-->
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Карточка услуги</title>
  <link rel="stylesheet" href="../../../card/job-card.css">
  <style>
    body { margin: 0; padding: 24px 16px; font-family: system-ui, sans-serif; background: #f8f9fa; color: #202124; }
    h1 { font-size: 20px; }
    .label { font-size: 13px; color: #5f6368; margin: 32px 0 8px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; }
    .sidebar { width: 280px; max-width: 100%; }
    .service .job-card { --jc-color-primary: #e8590c; --jc-color-highlight: #fff4e6; --jc-radius: 16px; }
  </style>
</head>
<body>
  <h1>Карточка услуги</h1>
  <p style="font-size: 14px; color: #5f6368;">Шаблон: компания, категория, название услуги, место проведения. Обязательны: детали (цена, срок) и кнопки действия. Логотип и бэдж опциональны.</p>

  <template id="card-tpl">
    <article class="job-card">
      <div class="job-card__body">
        <img class="job-card__logo" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' fill='%23e8590c' rx='4'/%3E%3Ctext x='24' y='32' font-size='28' font-weight='bold' fill='%23fff' text-anchor='middle'%3EDC%3C/text%3E%3C/svg%3E" alt="" width="92" height="92">
        <div class="job-card__main">
          <p class="job-card__company">Digital CashFlow</p>
          <p class="job-card__level">Под ключ</p>
          <h3 class="job-card__role">Настройка Яндекс.Директа</h3>
          <p class="job-card__location">Онлайн<em class="job-card__accent"> (вся РФ)</em></p>
        </div>
        <div class="job-card__details">
          <span>от 30 000<em class="job-card__muted"> ₽</em></span>
          <span class="job-card__muted">запуск за 3 дня</span>
        </div>
        <div class="job-card__footer">
          <div class="job-card__badge">
            <img class="job-card__avatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' fill='%23e8590c'/%3E%3Ctext x='20' y='26' font-size='24' font-weight='bold' fill='%23fff' text-anchor='middle'%3E98%25%3C/text%3E%3C/svg%3E" alt="" width="40" height="40">
            <p class="job-card__badge-text"><em class="job-card__accent">98%</em><span class="job-card__badge-label"> клиентов продлевают</span></p>
          </div>
          <button type="button" class="job-card__btn" aria-label="Поделиться">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11A2.99 2.99 0 1 0 15 5c0 .24.04.47.09.7L8.04 9.81a3 3 0 1 0 0 4.38l7.12 4.16c-.05.21-.08.43-.08.65A2.92 2.92 0 1 0 18 16.08z"/></svg>
          </button>
          <button type="button" class="job-card__btn" aria-label="В избранное" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
          </button>
        </div>
      </div>
    </article>
  </template>

  <p class="label">Сетка услуг</p>
  <div class="grid service" data-slot="3"></div>

  <p class="label">Узкий сайдбар 280px</p>
  <div class="sidebar service" data-slot="1"></div>

  <script>
    const tpl = document.getElementById('card-tpl');
    document.querySelectorAll('[data-slot]').forEach(slot => {
      for (let i = 0; i < +slot.dataset.slot; i++) slot.append(tpl.content.cloneNode(true));
    });
    document.addEventListener('click', e => {
      const btn = e.target.closest('.job-card__btn[aria-pressed]');
      if (btn) btn.setAttribute('aria-pressed', btn.getAttribute('aria-pressed') !== 'true');
    });
  </script>
</body>
</html>
