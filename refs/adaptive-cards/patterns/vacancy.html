<!--
  Карточка вакансии: логотип компании, название компании, уровень должности, название позиции, локация с опцией удалёнки.
  Опциональные элементы: зарплата, время публикации, бэдж с процентом совпадения профиля.
  Обязательные: все поля в основной структуре, кнопки (поделиться/добавить в закладки).
-->
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вакансия</title>
  <link rel="stylesheet" href="../../../card/job-card.css">
  <style>
    body { margin: 0; padding: 24px 16px; font-family: system-ui, sans-serif; background: #f8f9fa; color: #202124; }
    h1 { font-size: 20px; }
    .label { font-size: 13px; color: #5f6368; margin: 32px 0 8px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; }
    .sidebar { width: 280px; max-width: 100%; }
    .vacancy .job-card { --jc-color-primary: #9c27b0; --jc-color-highlight: #f3e5f5; --jc-radius: 16px; }
  </style>
</head>
<body>
  <h1>Вакансия</h1>
  <p style="font-size: 14px; color: #5f6368;">Шаблон: логотип компании, название компании, уровень должности, название позиции, локация. Опционально: зарплата, дата публикации, бэдж по совпадению с профилем.</p>

  <template id="card-tpl">
    <article class="job-card">
      <div class="job-card__body">
        <img class="job-card__logo" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath fill='%234285F4' d='M45 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h11.8a10 10 0 0 1-4.4 6.6v5.5h7.1C42.6 36.8 45 31.1 45 24.5z'/%3E%3Cpath fill='%2334A853' d='M24 46c5.9 0 10.9-2 14.5-5.3l-7.1-5.5c-2 1.3-4.5 2.1-7.4 2.1-5.7 0-10.5-3.8-12.2-9H4.5v5.7A22 22 0 0 0 24 46z'/%3E%3Cpath fill='%23FBBC05' d='M11.8 28.3a13 13 0 0 1 0-8.6V14H4.5a22 22 0 0 0 0 19.9l7.3-5.6z'/%3E%3Cpath fill='%23EA4335' d='M24 10.7c3.2 0 6.1 1.1 8.4 3.3l6.3-6.3A22 22 0 0 0 4.5 14l7.3 5.7c1.7-5.2 6.5-9 12.2-9z'/%3E%3C/svg%3E" alt="" width="92" height="92">
        <div class="job-card__main">
          <p class="job-card__company">Google</p>
          <p class="job-card__level">Junior</p>
          <h3 class="job-card__role">AI Engineer</h3>
          <p class="job-card__location">Флорида, США<em class="job-card__accent"> (Remote)</em></p>
        </div>
        <div class="job-card__details">
          <span>10k<em class="job-card__muted">/месяц</em></span>
          <span class="job-card__muted">3 часа назад</span>
        </div>
        <div class="job-card__footer">
          <div class="job-card__badge">
            <img class="job-card__avatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' fill='%23a5b4fc'/%3E%3Ccircle cx='20' cy='16' r='7' fill='%23fff'/%3E%3Cpath d='M6 40a14 14 0 0 1 28 0z' fill='%23fff'/%3E%3C/svg%3E" alt="" width="40" height="40">
            <p class="job-card__badge-text"><em class="job-card__accent">64%</em><span class="job-card__badge-label"> совпадение</span></p>
          </div>
          <button type="button" class="job-card__btn" aria-label="Поделиться">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11A2.99 2.99 0 1 0 15 5c0 .24.04.47.09.7L8.04 9.81a3 3 0 1 0 0 4.38l7.12 4.16c-.05.21-.08.43-.08.65A2.92 2.92 0 1 0 18 16.08z"/></svg>
          </button>
          <button type="button" class="job-card__btn" aria-label="В закладки" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
          </button>
        </div>
      </div>
    </article>
  </template>

  <p class="label">Сетка вакансий</p>
  <div class="grid vacancy" data-slot="3"></div>

  <p class="label">Узкий сайдбар 280px</p>
  <div class="sidebar vacancy" data-slot="1"></div>

  <script>
    const tpl = document.getElementById('card-tpl');
    document.querySelectorAll('[data-slot]').forEach(slot => {
      for (let i = 0; i < +slot.dataset.slot; i++) slot.append(tpl.content.cloneNode(true));
    });
    document.addEventListener('click', e => {
      const btn = e.target.closest('.job-card__btn[aria-pressed]');
      if (btn) btn.setAttribute('aria-pressed', btn.getAttribute('aria-pressed') !== 'true');
    });
  </script>
</body>
</html>
