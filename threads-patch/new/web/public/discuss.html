<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="robots" content="noindex">
<title>Треды — AI-платформа</title>
<link rel="stylesheet" href="/ui.css?v=100">
<!-- /theme.css строго ПОСЛЕ /ui.css и ровно один раз (ADR-319) -->
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/discuss.css?v=1">
<!-- метка статуса .ui-st рисуется синхронно — uiColorVar нужен ВЫШЕ скрипта страницы (ui.md, ADR-285) -->
<script src="/ui-color.js?v=1"></script>
<!-- ссылки в тексте сообщений — только cfLinkify (ui.md) -->
<script src="/linkify.js?v=2"></script>
</head>
<body>
<!-- «Треды» (/discuss, 26.10.2026): обсуждения задач и тикетов, чаты CRM и лента Threads одним списком.
     Данные — GET /api/discuss/list и /api/discuss/item (web/discuss.js), только чтение. Адрес /threads
     занят постингом в Threads, поэтому раздел на /discuss. Шапку собирает /page-header.js из <h1> и
     p.ph-s (ADR-147), панель списка — шаблон .lt-one + ltBuild (ADR-338), вкладки — .ui-tabs > .ui-tab. -->
<div id="app" class="ui-page dc-page">
  <h1>Треды</h1>
  <p class="ph-s"><span id="dc-sub">Загружаю…</span></p>

  <div class="lt lt-one" data-lt-tpl="default">
    <label class="lt-find" data-lt-slot="search">
      <svg aria-hidden="true"><use href="/assets/icons.svg#i-search"></use></svg>
      <input id="dc-q" type="search" placeholder="Поиск по тредам, людям, клиентам" autocomplete="off" title="Поиск — /">
    </label>
    <nav class="ui-tabs lt-tabs" data-lt-slot="tabs" id="dc-tabs" aria-label="Что показывать">
      <button type="button" class="ui-tab is-on" data-type="all" aria-pressed="true">Все <span class="dc-n" id="dc-n-all"></span></button>
      <button type="button" class="ui-tab" data-type="talks" aria-pressed="false">Обсуждения <span class="dc-n" id="dc-n-talks"></span></button>
      <button type="button" class="ui-tab" data-type="feed" aria-pressed="false">Лента <span class="dc-n" id="dc-n-feed"></span></button>
      <button type="button" class="ui-tab" data-type="chats" aria-pressed="false">Чаты <span class="dc-n" id="dc-n-chats"></span></button>
    </nav>
  </div>

  <div class="dc-grid fx-row">
    <section class="dc-list" id="dc-list" aria-label="Треды" aria-busy="true"></section>
    <aside class="dc-pv" id="dc-pv" aria-label="Превью треда" aria-live="polite"></aside>
  </div>
</div>

<script src="/toast.js"></script>
<!-- ltBuild — порядок слотов панели из /toolbar-template.json -->
<script src="/list-toolbar.js?v=6"></script>
<script src="/discuss_page.js?v=1"></script>
<script src="/sidebar.js?v=20261027a"></script>
</body>
</html>
