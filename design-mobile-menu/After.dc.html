<!doctype html>
<html>

<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    a { color: #00a0ff; } a:hover { color: #4dbcff; }
    .badge { margin-left: auto; background: #e05252; color: #fff; font-size: 10px; min-width: 18px;
             height: 18px; border-radius: 9px; display: flex; align-items: center; justify-content: center; padding: 0 5px; }
    .cap { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: #555; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0a0a0a; overflow: hidden; display: flex; flex-direction: column; color: #e8e8e8">

      <div style="font-size: 11px; color: #555">v[версия]</div>
      <div style="margin-left: auto; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #666">
        <svg style="width: 18px; height: 18px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </div>
    </div>

    <!-- поиск под логотипом -->
    <div style="flex: 0 0 auto; padding: 6px 14px 0">

        <svg style="width: 17px; height: 17px; flex: 0 0 auto; color: #00a0ff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <span>Поиск по разделам</span>
      </div>
    </div>

    <div style="flex: 1 1 auto; min-height: 0; overflow: hidden; display: flex; flex-direction: column; padding: 0 14px">

      <div class="cap" style="padding: 16px 6px 8px">Быстрый доступ</div>

      <div style="display: flex; flex-direction: column; background: #101010; border: 1px solid #1e1e1e; border-radius: 10px; overflow: hidden">

          <svg style="width: 20px; height: 20px; flex: 0 0 auto; color: #00a0ff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>

          <svg style="width: 20px; height: 20px; flex: 0 0 auto; color: #00a0ff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg>

      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-height: 76px; background: #101010; border: 1px solid #1e1e1e; border-radius: 8px">
          <svg style="width: 20px; height: 20px; color: #8a8a8a" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
          <span style="font-size: 12px; color: #8b8b8b">Главная</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-height: 76px; background: #101010; border: 1px solid #1e1e1e; border-radius: 8px">
          <svg style="width: 20px; height: 20px; color: #8a8a8a" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>

      <div style="display: flex; align-items: center; gap: 10px; min-height: 52px; margin-top: 8px; padding: 0 12px; background: #101010; border: 1px solid #1e1e1e; border-radius: 8px">
        <svg style="width: 18px; height: 18px; flex: 0 0 auto; color: #8a8a8a" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg>
        <span style="font-size: 13px; color: #8b8b8b">Масштаб</span>
        <div style="margin-left: auto; display: flex; align-items: center; gap: 4px">
          <div style="min-width: 34px; height: 30px; display: flex; align-items: center; justify-content: center; border: 1px solid #262626; border-radius: 7px; color: #8b8b8b; font-size: 14px">А−</div>
          <div style="min-width: 44px; text-align: center; font-size: 12px; color: #666">100%</div>
          <div style="min-width: 34px; height: 30px; display: flex; align-items: center; justify-content: center; border: 1px solid #262626; border-radius: 7px; color: #8b8b8b; font-size: 14px">А+</div>
        </div>
      </div>

      <div class="cap" style="padding: 18px 6px 8px">Разделы</div>

      <div style="display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; align-items: center; gap: 11px; min-height: 44px; padding: 0 12px; background: #101010; border: 1px solid #1e1e1e; border-radius: 8px">
          <div style="width: 6px; height: 6px; border-radius: 3px; background: #00a0ff; box-shadow: 0 0 6px rgba(0,160,255,.6)"></div>
          <span style="font-size: 14px; color: #e8e8e8">Работа</span>
          <span style="margin-left: auto; font-size: 12px; color: #555">7</span>
          <svg style="width: 16px; height: 16px; color: #555" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </div>
        <div style="display: flex; align-items: center; gap: 11px; min-height: 44px; padding: 0 12px; background: #101010; border: 1px solid #1e1e1e; border-radius: 8px">
          <div style="width: 6px; height: 6px; border-radius: 3px; background: #262626"></div>
          <span style="font-size: 14px; color: #8b8b8b">AI-CRM</span>
          <span style="margin-left: auto; font-size: 12px; color: #555">10</span>
          <svg style="width: 16px; height: 16px; color: #555" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </div>
        <div style="display: flex; align-items: center; gap: 11px; min-height: 44px; padding: 0 12px; background: #101010; border: 1px solid #1e1e1e; border-radius: 8px">
          <div style="width: 6px; height: 6px; border-radius: 3px; background: #262626"></div>
          <span style="font-size: 14px; color: #8b8b8b">SEO</span>
          <span style="margin-left: auto; font-size: 12px; color: #555">6</span>
          <svg style="width: 16px; height: 16px; color: #555" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </div>
        <div style="display: flex; align-items: center; gap: 11px; min-height: 44px; padding: 0 12px; background: #101010; border: 1px solid #1e1e1e; border-radius: 8px">
          <div style="width: 6px; height: 6px; border-radius: 3px; background: #262626"></div>
          <span style="font-size: 14px; color: #8b8b8b">Справочники</span>
          <span style="margin-left: auto; font-size: 12px; color: #555">3</span>
          <svg style="width: 16px; height: 16px; color: #555" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </div>
        <div style="display: flex; align-items: center; gap: 11px; min-height: 44px; padding: 0 12px; background: #101010; border: 1px solid #1e1e1e; border-radius: 8px">
          <div style="width: 6px; height: 6px; border-radius: 3px; background: #262626"></div>
          <span style="font-size: 14px; color: #8b8b8b">Финансы</span>
          <span style="margin-left: auto; font-size: 12px; color: #555">4</span>
          <svg style="width: 16px; height: 16px; color: #555" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </div>
        <div style="display: flex; align-items: center; gap: 11px; min-height: 44px; padding: 0 12px; background: #101010; border: 1px solid #1e1e1e; border-radius: 8px">
          <div style="width: 6px; height: 6px; border-radius: 3px; background: #262626"></div>
          <span style="font-size: 14px; color: #8b8b8b">Личное</span>
          <span style="margin-left: auto; font-size: 12px; color: #555">4</span>
          <svg style="width: 16px; height: 16px; color: #555" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </div>
      </div>

    </div>
  </div>
</div>
</x-dc>
