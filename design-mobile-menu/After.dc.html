  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    a { color: #00a0ff; } a:hover { color: #4dbcff; }
    .badge { background: #e05252; color: #fff; font-size: 10px; min-width: 18px; height: 18px;
             border-radius: 9px; display: flex; align-items: center; justify-content: center; padding: 0 5px; }
    .cap { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: #555; }
    /* значки в строке логотипа — размером с бургер, 42px */
    .act { width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; color: #8a8a8a; }
    .act svg { width: 22px; height: 22px; }
    /* плитки подвала — .ui-tiles платформы: 3 в ряд, зазор 8 */
    .tile { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
            min-height: 76px; box-sizing: border-box; padding: 8px 6px; background: #101010;
            border: 1px solid #1e1e1e; border-radius: 8px; color: #8b8b8b; font-size: 12px;
            line-height: 1.25; text-align: center; }
    .tile svg { width: 20px; height: 20px; flex: 0 0 auto; color: #8a8a8a; }
    /* дерево пунктов раскрытой группы — как в мобильном сайдбаре */
    .tree { position: relative; display: flex; flex-direction: column; }
    .tree::before { content: ''; position: absolute; left: 27px; top: 0; bottom: 6px; width: 1px; background: #1c1c1c; }
    .row { position: relative; display: flex; align-items: center; gap: 11px; min-height: 44px;
           padding: 0 12px 0 44px; font-size: 14px; color: #8b8b8b; }
    .row::before { content: ''; position: absolute; left: 28px; top: 50%; width: 9px; height: 1px; background: #232323; }
    .row .ico { width: 18px; height: 18px; flex: 0 0 auto; color: #8a8a8a; }
    .row .pin { width: 16px; height: 16px; flex: 0 0 auto; margin-left: auto; color: #555; }
    .row.on { color: #00a0ff; background: linear-gradient(90deg, rgba(0,160,255,.14), rgba(0,160,255,.03)); }
    .row.on::before { background: #00a0ff; width: 12px; box-shadow: 0 0 6px rgba(0,160,255,.6); }
    .row.on .ico { color: #00a0ff; }
    .q { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 12px; }
    .q .ico { width: 20px; height: 20px; flex: 0 0 auto; color: #00a0ff; }
    .q .pin { width: 16px; height: 16px; flex: 0 0 auto; color: #00a0ff; }
    .q .nm { font-size: 15px; font-weight: 600; color: #e8e8e8; }
  </style>
</helmet>
